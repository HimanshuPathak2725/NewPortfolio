<svg xmlns="http://www.w3.org/2000/svg" class="project-world" viewBox="20 70 560 570" role="img" aria-labelledby="working-world-title working-world-desc">
<title id="working-world-title">A world of working systems</title>
<desc id="working-world-desc">An original architectural illustration of one floating island. A workshop and looping test track evoke execution-based learning; an observatory evokes security assessment; a translucent gateway evokes packet filtering; and a river of transaction lights passes an observation station. Their connections are artistic metaphors, not shared project infrastructure.</desc>
<defs>
  <linearGradient id="pw-earth" x2=".8" y2="1"><stop stop-color="#ded3b5"/><stop offset="1" stop-color="#a7bdb2"/></linearGradient>
  <linearGradient id="pw-cliff" x2=".5" y2="1"><stop stop-color="#8eaaa3"/><stop offset="1" stop-color="#cdd9cc" stop-opacity=".1"/></linearGradient>
  <linearGradient id="pw-glass" x2="1" y2="1"><stop stop-color="#8bbfc6" stop-opacity=".15"/><stop offset=".55" stop-color="#79aaa9" stop-opacity=".55"/><stop offset="1" stop-color="#667bb4" stop-opacity=".15"/></linearGradient>
  <linearGradient id="pw-dome" x2="1" y2=".7"><stop stop-color="#a3b4cf"/><stop offset=".55" stop-color="#596f97"/><stop offset="1" stop-color="#3f526f"/></linearGradient>
  <linearGradient id="pw-water" x2=".6" y2="1"><stop stop-color="#668bb4"/><stop offset=".5" stop-color="#529eaa"/><stop offset="1" stop-color="#9bbec0"/></linearGradient>
  <radialGradient id="pw-halo"><stop stop-color="#e5c677" stop-opacity=".2"/><stop offset="1" stop-color="#e5c677" stop-opacity="0"/></radialGradient>
  <pattern id="pw-hatching" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><path d="M0 0V7" stroke="#536e76" stroke-width=".7" opacity=".3"/></pattern>
  <symbol id="pw-tree" viewBox="0 0 30 58"><path d="M15 34v23m0-15-8-8m8 3 7-10" fill="none" stroke="#496b61" stroke-width="1.3"/><path d="M15 1C5 12 2 23 4 33C8 43 22 45 26 32C29 21 23 8 15 1Z" fill="#699584" stroke="#456f61" stroke-width="1"/><path d="M15 7C11 22 11 31 15 39" fill="none" stroke="#c0cfaa" stroke-width="1.1"/></symbol>
  <symbol id="pw-bush" viewBox="0 0 30 20"><path d="M2 18C-4 7 6 3 11 9C10-2 26 0 25 10C33 8 33 20 23 20Z" fill="#8ba58a"/><path d="m7 18 2-8m8 9-1-11m8 11-1-7" stroke="#527c6c" stroke-width=".8"/></symbol>
  <symbol id="pw-grass" viewBox="0 0 16 12"><path d="m2 11 2-6 3 6 2-10 3 10 2-5" fill="none" stroke="#729285" stroke-width="1" stroke-linecap="round"/></symbol>
</defs>
