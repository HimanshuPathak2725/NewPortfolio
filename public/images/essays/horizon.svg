<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="essay-horizon-wide-export-title essay-horizon-wide-export-desc" class="essay-svg"><title id="essay-horizon-wide-export-title">A persistent mistake compounds differently from fresh noise</title><desc id="essay-horizon-wide-export-desc">A scalar random walk with uncertain fixed drift has epistemic variance proportional to horizon squared and process variance proportional to horizon. Redrawing the drift at each step produces a different, narrower distribution.</desc><rect width="100%" height="100%" fill="#fef9ed"/><g font-family="Inter, system-ui, sans-serif"><text x="48" y="26" fill="var(--ink,#262723)" font-size="18" text-anchor="start">a  Exact predictive fan</text><path d="M48.00 210.75L56.60 207.51L65.20 205.43L73.80 203.50L82.40 201.64L91.00 199.83L99.60 198.04L108.20 196.28L116.80 194.53L125.40 192.78L134.00 191.05L142.60 189.32L151.20 187.60L159.80 185.88L168.40 184.16L177.00 182.45L185.60 180.74L194.20 179.03L202.80 177.32L211.40 175.62L220.00 173.92L228.60 172.21L237.20 170.51L245.80 168.81L254.40 167.11L263.00 165.42L271.60 163.72L280.20 162.02L288.80 160.33L297.40 158.63L306.00 156.93L314.60 155.24L323.20 153.55L331.80 151.85L340.40 150.16L349.00 148.46L357.60 146.77L366.20 145.08L374.80 143.39L383.40 141.69L392.00 140.00L400.60 138.31L409.20 136.62L417.80 134.93L426.40 133.24L435.00 131.54L443.60 129.85L452.20 128.16L460.80 126.47L469.40 124.78L478.00 123.09L486.60 121.40L495.20 119.71L503.80 118.02L512.40 116.33L521.00 114.64L529.60 112.95L538.20 111.26L546.80 109.57L555.40 107.88L564.00 106.19L572.60 104.50L581.20 102.81L589.80 101.12L598.40 99.43L607.00 97.74L615.60 96.06L624.20 94.37L632.80 92.68L641.40 90.99L650.00 89.30L658.60 87.61L667.20 85.92L675.80 84.23L684.40 82.54L693.00 80.86L701.60 79.17L710.20 77.48L718.80 75.79L727.40 74.10L736.00 72.41L736.00 179.09L727.40 179.52L718.80 179.96L710.20 180.40L701.60 180.83L693.00 181.27L684.40 