<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="essay-potential-wide-export-title essay-potential-wide-export-desc" class="essay-svg"><title id="essay-potential-wide-export-title">A different signal, the same ordering</title><desc id="essay-potential-wide-export-desc">A five-state chain with potential increasing from minus four to zero. Discounted shaping terms sum to four; the original discounted return is 0.729 and the shaped return is 4.729.</desc><rect width="100%" height="100%" fill="#fef9ed"/><g font-family="Inter, system-ui, sans-serif"><text x="48" y="26" fill="var(--ink,#262723)" font-size="18" text-anchor="start">a  A potential along the route</text><path d="M48 62L48 232" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><path d="M48 232L736 232" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><path d="M43 232L48 232" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="38" y="237" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">−4</text><path d="M43 147L48 147" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="38" y="152" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">−2</text><path d="M43 62L48 62" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="38" y="67" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">0</text><path d="M48.00 232.00L220.00 189.50L392.00 147.00L564.00 104.50L736.00 62.00" fill="none" stroke="var(--brand,#5b6c8b)" stroke-width="2.5" /><circle cx="48" cy="232" r="4" fill="var(--brand,#5b6c8b)"/><text x="48" y="260" fill="var(--muted,#6a6864)" font-size="15" text-anchor="middle">s0</text><circle cx="220" cy="189.5" r="4" fill="var(--brand,#5b6c8b)"/><text x="220" y="260" fill="var(--muted,#6a6864)" font-size="15" text-anchor="middle">s1</text><circle cx="392" cy="147" r="4" fill="var(--brand,#5b6c8b)"/><text x="392" y="260" fill="var(--muted,#6a6864)" font-size="15" text-anchor="middle">s2</text><circle cx="564" cy="104.5" r="4" fill="var(--brand,#5b6c8b)"/><text x="564" y="260" fill="var(--muted,#6a6864)" font-size="15" text-anchor="middle">s3</text><circle cx="736" cy="62" r="4" fill="var(--brand,#5b6c8b)"/><text x="736" y="260" fill="var(--muted,#6a6864)" font-size="15" text-anchor="middle">goal</text><circle cx="736" cy="62" r="7" fill="var(--warm,#946655)"/><text x="48" y="310" fill="var(--ink,#262723)" font-size="18" text-anchor="start">b  Discounted shaping contributions</text><text x="134" y="362" fill="var(--brand,#5b6c8b)" font-size="21" text-anchor="middle">1.300</text><rect x="52" y="380" width="164" height="4" fill="var(--brand,#5b6c8b)"/><text x="134" y="410" fill="var(--muted,#6a6864)" font-size="14" text-anchor="middle">t = 0</text><text x="306" y="362" fill="var(--brand,#5b6c8b)" font-size="21" text-anchor="middle">1.080</text><rect x="224" y="380" width="164" height="4" fill="var(--brand,#5b6c8b)"/><text x="306" y="410" fill="var(--muted,#6a6864)" font-size="14" text-anchor="middle">t = 1</text><text x="478" y="362" fill="var(--brand,#5b6c8b)" font-size="21" text-anchor="middle">0.891</text><rect x="396" y="380" width="164" height="4" fill="var(--brand,#5b6c8b)"/><text x="478" y="410" fill="var(--muted,#6a6864)" font-size="14" text-anchor="middle">t = 2</text><text x="650" y="362" fill="var(--brand,#5b6c8b)" font-size="21" text-anchor="middle">0.729</text><rect x="568" y="380" width="164" height="4" fill="var(--brand,#5b6c8b)"/><text x="650" y="410" fill="var(--muted,#6a6864)" font-size="14" text-anchor="middle">t = 3</text><text x="48" y="455" fill="var(--ink,#262723)" font-size="22" text-anchor="start">Sum so far: 4.000</text><text x="48" y="518" fill="var(--link,#476e49)" font-size="19" text-anchor="start">G′ − G = −Φ(s₀) = 4</text></g></svg>