<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="essay-luck-wide-export-title essay-luck-wide-export-desc" class="essay-svg"><title id="essay-luck-wide-export-title">A better action, punished by a bad draw</title><desc id="essay-luck-wide-export-desc">Four equiprobable outcomes of R equals 2 A plus independent weather W. An ordinary baseline produces gradient estimates minus 4.5 or plus 5.5. A weather-conditioned baseline gives 0.5 every time. A baseline equal to the reward erases the gradient entirely.</desc><rect width="100%" height="100%" fill="#fef9ed"/><g font-family="Inter, system-ui, sans-serif"><text x="48" y="26" fill="var(--ink,#262723)" font-size="18" text-anchor="start">a  Two causes of the same outcome</text><text x="78" y="83" fill="var(--brand,#5b6c8b)" font-size="19" text-anchor="middle">Action A</text><text x="701" y="83" fill="var(--warm,#946655)" font-size="19" text-anchor="middle">Weather W</text><path d="M78 98L365 138" stroke="var(--brand,#5b6c8b)" stroke-width="1.2" fill="none" /><path d="M701 98L395 138" stroke="var(--warm,#946655)" stroke-width="1.2" fill="none" /><path d="M365 138l-10 -1 4 -7Z" fill="var(--brand,#5b6c8b)"/><path d="M395 138l10 -1 -4 -7Z" fill="var(--warm,#946655)"/><text x="380" y="169" fill="var(--ink,#262723)" font-size="24" text-anchor="middle">R = 2A + W</text><text x="48" y="211" fill="var(--warm,#946655)" font-size="20" text-anchor="start">Baseline = 0.00(1 + W) + 1.00R</text><text x="48" y="252" fill="var(--ink,#262723)" font-size="18" text-anchor="start">b  Four possible gradient estimates</text><path d="M420.66666666666663 273L420.66666666666663 455" stroke="var(--link,#476e49)" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/><text x="48" y="291" fill="var(--muted,#6a6864)" font-size="13" text-anchor="start">A=0, W=-10</text><path d="M48 304L736 304" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" stroke-dasharray="2 5"/><circle cx="392" cy="304" r="6" fill="var(--warm,#946655)"/><text x="736" y="291" fill="var(--warm,#946655)" font-size="14" text-anchor="end">0.00</text><text x="48" y="340" fill="var(--muted,#6a6864)" font-size="13" text-anchor="start">A=0, W=+10</text><path d="M48 353L736 353" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" stroke-dasharray="2 5"/><circle cx="392" cy="353" r="6" fill="var(--warm,#946655)"/><text x="736" y="340" fill="var(--warm,#946655)" font-size="14" text-anchor="end">0.00</text><text x="48" y="389" fill="var(--muted,#6a6864)" font-size="13" text-anchor="start">A=1, W=-10</text><path d="M48 402L736 402" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" stroke-dasharray="2 5"/><circle cx="392" cy="402" r="6" fill="var(--brand,#5b6c8b)"/><text x="736" y="389" fill="var(--brand,#5b6c8b)" font-size="14" text-anchor="end">0.00</text><text x="48" y="438" fill="var(--muted,#6a6864)" font-size="13" text-anchor="start">A=1, W=+10</text><path d="M48 451L736 451" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" stroke-dasharray="2 5"/><circle cx="392" cy="451" r="6" fill="var(--brand,#5b6c8b)"/><text x="736" y="438" fill="var(--brand,#5b6c8b)" font-size="14" text-anchor="end">0.00</text><text x="48" y="487" fill="var(--ink,#262723)" font-size="20" text-anchor="start">Mean 0.00 · Variance 0.00</text><text x="48" y="525" fill="var(--link,#476e49)" font-size="17" text-anchor="start">Dashed vertical: correct gradient = 0.5</text></g></svg>