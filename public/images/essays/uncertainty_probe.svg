<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="essay-uncertainty_probe-wide-export-title essay-uncertainty_probe-wide-export-desc" class="essay-svg"><title id="essay-uncertainty_probe-wide-export-title">Which observation can change the decision?</title><desc id="essay-uncertainty_probe-wide-export-desc">Bayesian updates over two bending worlds, both with uncertain slope, after 32 familiar observations. Familiar probes cannot distinguish the worlds. Near-boundary probes are noisy and can favor the wrong world. Far probes discriminate strongly in this constructed example.</desc><rect width="100%" height="100%" fill="#fef9ed"/><g font-family="Inter, system-ui, sans-serif"><text x="48" y="26" fill="var(--ink,#262723)" font-size="19" text-anchor="start">a  P(downward world) · probe x = 0.8</text><path d="M48 62L48 282" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><path d="M48 282L736 282" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><path d="M48 282L48 287" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="48" y="307" fill="var(--muted,#6a6864)" font-size="14" text-anchor="middle">0</text><path d="M392 282L392 287" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="392" y="307" fill="var(--muted,#6a6864)" font-size="14" text-anchor="middle">8</text><path d="M736 282L736 287" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="736" y="307" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">16 probes</text><path d="M43 282L48 282" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="38" y="287" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">0</text><path d="M43 172L48 172" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="38" y="177" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">0.5</text><path d="M43 62L48 62" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="38" y="67" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">1</text><path d="M48 172L736 172" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" stroke-dasharray="3 5"/><path d="M48.00 172.00L91.00 172.00L134.00 172.00L177.00 172.00L220.00 172.00L263.00 172.00L306.00 172.00L349.00 172.00L392.00 172.00L435.00 172.00L478.00 172.00L521.00 172.00L564.00 172.00L607.00 172.00L650.00 172.00L693.00 172.00L736.00 172.00" fill="none" stroke="var(--brand,#5b6c8b)" stroke-width="2.5" /><circle cx="736" cy="172" r="5" fill="var(--brand,#5b6c8b)"/><text x="48" y="343" fill="var(--ink,#262723)" font-size="20" text-anchor="start">b  Decision after 16 probes</text><text x="48" y="391" fill="var(--muted,#6a6864)" font-size="18" text-anchor="start">Seed 0 chooses</text><text x="736" y="391" fill="var(--ink,#262723)" font-size="21" text-anchor="end">x = 2</text><text x="48" y="436" fill="var(--muted,#6a6864)" font-size="18" text-anchor="start">True expected reward</text><text x="736" y="436" fill="var(--warm,#946655)" font-size="21" text-anchor="end">0.0</text><text x="48" y="481" fill="var(--muted,#6a6864)" font-size="18" text-anchor="start">Choose better · all seeds</text><text x="736" y="481" fill="var(--link,#476e49)" font-size="21" text-anchor="end">0 / 256</text><text x="48" y="525" fill="var(--muted,#6a6864)" font-size="17" text-anchor="start">Fixed hypotheses; probe costs excluded.</text></g></svg>