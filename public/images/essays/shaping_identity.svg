<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="essay-shaping_identity-wide-export-title essay-shaping_identity-wide-export-desc" class="essay-svg"><title id="essay-shaping_identity-wide-export-title">The control that reproduced every action</title><desc id="essay-shaping_identity-wide-export-desc">In seed zero, the misleading-shaped learner and the learner initialized with the same potential have raw Q-values separated by five at the upper intermediate state. Adding that potential to the shaped values makes their curves coincide. Across all 128 seeds, each of three matched pairs has zero action mismatches.</desc><rect width="100%" height="100%" fill="#fef9ed"/><g font-family="Inter, system-ui, sans-serif"><text x="48" y="26" fill="var(--ink,#262723)" font-size="19" text-anchor="start">a  Raw estimates · upper state</text><path d="M48 62L48 277" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><path d="M48 277L736 277" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><path d="M48 277L48 282" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="48" y="302" fill="var(--muted,#6a6864)" font-size="14" text-anchor="middle">0</text><path d="M277.3333333333333 277L277.3333333333333 282" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="277.3333333333333" y="302" fill="var(--muted,#6a6864)" font-size="14" text-anchor="middle">100</text><path d="M506.66666666666663 277L506.66666666666663 282" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="506.66666666666663" y="302" fill="var(--muted,#6a6864)" font-size="14" text-anchor="middle">200</text><path d="M736 277L736 282" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="736" y="302" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">300 episodes</text><path d="M43 261.6428571428571L48 261.6428571428571" stroke="var(--muted,#6a6864)" stroke-w