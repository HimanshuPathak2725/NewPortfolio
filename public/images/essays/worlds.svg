<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="essay-worlds-wide-export-title essay-worlds-wide-export-desc" class="essay-svg"><title id="essay-worlds-wide-export-title">The same evidence. Opposite decisions.</title><desc id="essay-worlds-wide-export-desc">Two noiseless functions both equal x on the observed interval zero to one. Beyond one, one bends upward and the other downward. At action x equals two their rewards are four and zero, while the known action x equals 0.8 gives 0.8 in both worlds. A new observation at two identifies the downward world in this constructed two-world model.</desc><rect width="100%" height="100%" fill="#fef9ed"/><g font-family="Inter, system-ui, sans-serif"><text x="48" y="26" fill="var(--ink,#262723)" font-size="18" text-anchor="start">a  Where the evidence ends</text><rect x="48" y="62" width="344" height="265" fill="var(--brand,#5b6c8b)" opacity=".07"/><path d="M48 62L48 327" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><path d="M48 327L736 327" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><path d="M48 327L48 332" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="48" y="352" fill="var(--muted,#6a6864)" font-size="14" text-anchor="middle">0</text><path d="M392 327L392 332" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="392" y="352" fill="var(--muted,#6a6864)" font-size="14" text-anchor="middle">1</text><path d="M736 327L736 332" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="736" y="352" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">2 · action x</text><path d="M43 327L48 327" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="38" y="332" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">0</text><path d="M43 209.22222222222223L48 209.22222222222223" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text