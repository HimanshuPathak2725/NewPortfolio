l="var(--muted,#6a6864)" font-size="14" text-anchor="start">World</text><text x="463.59999999999997" y="422" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">x = 0.8</text><text x="736" y="422" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">x = 2</text><text x="48" y="453" fill="var(--brand,#5b6c8b)" font-size="18" text-anchor="start">Upper</text><text x="463.59999999999997" y="453" fill="var(--brand,#5b6c8b)" font-size="18" text-anchor="end">0.8</text><text x="736" y="453" fill="var(--brand,#5b6c8b)" font-size="18" text-anchor="end">4.0</text><text x="48" y="483" fill="var(--warm,#946655)" font-size="18" text-anchor="start">Lower</text><text x="463.59999999999997" y="483" fill="var(--warm,#946655)" font-size="18" text-anchor="end">0.8</text><text x="736" y="483" fill="var(--warm,#946655)" font-size="18" text-anchor="end">0.0</text><text x="48" y="524" fill="var(--ink,#262723)" font-size="19" text-anchor="start">Probe observed 0 → lower world.</text></g></svg>