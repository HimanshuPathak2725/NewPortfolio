<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="essay-cycle-wide-export-title essay-cycle-wide-export-desc" class="essay-svg"><title id="essay-cycle-wide-export-title">Can the agent get paid for going in circles?</title><desc id="essay-cycle-wide-export-desc">Two round trips between states with potentials zero and one. At discount one, potential shaping sums to zero while a bonus paid on each arrival at the second state grows to two.</desc><rect width="100%" height="100%" fill="#fef9ed"/><g font-family="Inter, system-ui, sans-serif"><text x="48" y="26" fill="var(--ink,#262723)" font-size="18" text-anchor="start">a  A repeatable two-state walk</text><path d="M212.6 120Q380 40 562.6 120 M562.6 144Q380 224 212.6 144" fill="none" stroke="var(--muted,#6a6864)" stroke-width="1.5"/><circle cx="197.6" cy="132" r="9" fill="var(--brand,#5b6c8b)"/><circle cx="577.6" cy="132" r="9" fill="var(--brand,#5b6c8b)"/><text x="197.6" y="169" fill="var(--ink,#262723)" font-size="17" text-anchor="middle">A · Φ = 0</text><text x="577.6" y="169" fill="var(--ink,#262723)" font-size="17" text-anchor="middle">B · Φ = 1</text><text x="380" y="65" fill="var(--brand,#5b6c8b)" font-size="18" text-anchor="middle">→  +1</text><text x="380" y="235" fill="var(--brand,#5b6c8b)" font-size="18" text-anchor="middle">←  −1</text><circle cx="197.60000000000002" cy="132" r="7" fill="var(--warm,#946655)"/><text x="48" y="308" fill="var(--ink,#262723)" font-size="18" text-anchor="start">b  Accumulated extra reward</text><path d="M48 335L48 465" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><path d="M48 465L736 465" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><path d="M48 465L48 470" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="48" y="490" fill="var(--muted,#6a6864)" font-size="14" text-anchor="middle">0</text><path d="M220 465L220 470" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="220" y="490" fill="var(--muted,#6a6864)" font-size="14" text-anchor="middle">1</text><path d="M392 465L392 470" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="392" y="490" fill="var(--muted,#6a6864)" font-size="14" text-anchor="middle">2</text><path d="M564 465L564 470" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="564" y="490" fill="var(--muted,#6a6864)" font-size="14" text-anchor="middle">3</text><path d="M736 465L736 470" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="736" y="490" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">4</text><path d="M43 465L48 465" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="38" y="470" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">0</text><path d="M43 410L48 410" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="38" y="415" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">1</text><path d="M43 355L48 355" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="38" y="360" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">2</text><path d="M48.00 465.00L220.00 410.00L392.00 465.00L564.00 410.00L736.00 465.00" fill="none" stroke="var(--brand,#5b6c8b)" stroke-width="2.5" /><path d="M48.00 465.00L220.00 410.00L392.00 410.00L564.00 355.00L736.00 355.00" fill="none" stroke="var(--warm,#946655)" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="736" cy="465" r="6" fill="var(--brand,#5b6c8b)"/><circle cx="736" cy="355" r="6" fill="var(--warm,#946655)"/><text x="48" y="515" fill="var(--muted,#6a6864)" font-size="16" text-anchor="start">Solid: potential   ·   Dashed: arrival bonus</text></g></svg>