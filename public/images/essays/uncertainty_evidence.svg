<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="essay-uncertainty_evidence-wide-export-title essay-uncertainty_evidence-wide-export-desc" class="essay-svg"><title id="essay-uncertainty_evidence-wide-export-title">A narrower interval around the wrong future</title><desc id="essay-uncertainty_evidence-wide-export-desc">A through-origin Gaussian linear model is fit to increasing quantities of data inside x between 0.2 and 1. Its prediction at x equals two concentrates near two, while the true mean there is zero. Held-out coverage stays near 95 percent at x equals 0.8 but collapses at two.</desc><rect width="100%" height="100%" fill="#fef9ed"/><g font-family="Inter, system-ui, sans-serif"><text x="48" y="26" fill="var(--ink,#262723)" font-size="18" text-anchor="start">a  Prediction at x = 2 · seed 0</text><path d="M48 62L48 282" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><path d="M48 282L736 282" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><path d="M48 282L48 287" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="48" y="307" fill="var(--muted,#6a6864)" font-size="14" text-anchor="middle">4</text><path d="M342.85714285714283 282L342.85714285714283 287" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="342.85714285714283" y="307" fill="var(--muted,#6a6864)" font-size="14" text-anchor="middle">32</text><path d="M736 282L736 287" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="736" y="307" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">512 samples</text><path d="M43 257.55555555555554L48 257.55555555555554" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><text x="38" y="262.55555555555554" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">0</text><path d="M43 196.44444444444446L48 196.44444444444446" stroke="var(--muted,#6a6864)" stroke-width="1.2" fill="none" /><