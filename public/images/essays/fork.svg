<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="essay-fork-wide-export-title essay-fork-wide-export-desc" class="essay-svg"><title id="essay-fork-wide-export-title">Punish the better move. Preserve the better route.</title><desc id="essay-fork-wide-export-desc">Two routes have task returns 1.8 and 0.9. Changing intermediate potentials from zero to minus five and plus five makes their first rewards minus 4.5 and plus 4.5. Their discounted returns and advantages do not change.</desc><rect width="100%" height="100%" fill="#fef9ed"/><g font-family="Inter, system-ui, sans-serif"><text x="48" y="26" fill="var(--ink,#262723)" font-size="18" text-anchor="start">a  Change only the reward convention</text><path d="M64 160L402.8 78" stroke="var(--brand,#5b6c8b)" stroke-width="1.2" fill="none" /><path d="M402.8 78L720 160" stroke="var(--brand,#5b6c8b)" stroke-width="1.2" fill="none" /><circle cx="402.8" cy="78" r="6" fill="var(--brand,#5b6c8b)"/><text x="402.8" y="64" fill="var(--brand,#5b6c8b)" font-size="17" text-anchor="middle">Φ = -5.0</text><text x="229.4" y="109" fill="var(--brand,#5b6c8b)" font-size="18" text-anchor="middle">-4.50</text><text x="569.4" y="109" fill="var(--brand,#5b6c8b)" font-size="18" text-anchor="middle">7.00</text><path d="M64 160L402.8 240" stroke="var(--warm,#946655)" stroke-width="1.2" fill="none" /><path d="M402.8 240L720 160" stroke="var(--warm,#946655)" stroke-width="1.2" fill="none" /><circle cx="402.8" cy="240" r="6" fill="var(--warm,#946655)"/><text x="402.8" y="268" fill="var(--warm,#946655)" font-size="17" text-anchor="middle">Φ = 5.0</text><text x="229.4" y="222" fill="var(--warm,#946655)" font-size="18" text-anchor="middle">4.50</text><text x="569.4" y="222" fill="var(--warm,#946655)" font-size="18" text-anchor="middle">-4.00</text><circle cx="64" cy="160" r="7" fill="var(--ink,#262723)"/><circle cx="720" cy="160" r="7" fill="var(--ink,#262723)"/><text x="64" y="190" fill="var(--muted,#6a6864)" font-size="14" text-anchor="middle">start</text><text x="720" y="190" fill="var(--muted,#6a6864)" font-size="14" text-anchor="middle">end</text><text x="48" y="315" fill="var(--ink,#262723)" font-size="18" text-anchor="start">b  What the policy still prefers</text><text x="48" y="350" fill="var(--muted,#6a6864)" font-size="14" text-anchor="start">Route</text><text x="456" y="350" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">Return</text><text x="736" y="350" fill="var(--muted,#6a6864)" font-size="14" text-anchor="end">Advantage</text><text x="48" y="390" fill="var(--brand,#5b6c8b)" font-size="20" text-anchor="start">Upper</text><text x="456" y="390" fill="var(--brand,#5b6c8b)" font-size="22" text-anchor="end">1.80</text><text x="736" y="390" fill="var(--brand,#5b6c8b)" font-size="22" text-anchor="end">+0.45</text><text x="48" y="445" fill="var(--warm,#946655)" font-size="20" text-anchor="start">Lower</text><text x="456" y="445" fill="var(--warm,#946655)" font-size="22" text-anchor="end">0.90</text><text x="736" y="445" fill="var(--warm,#946655)" font-size="22" text-anchor="end">-0.45</text><text x="48" y="505" fill="var(--ink,#262723)" font-size="20" text-anchor="start">The immediate sign is not the preference.</text><text x="48" y="531" fill="var(--link,#476e49)" font-size="19" text-anchor="start">A′π(s, a) = Aπ(s, a)</text></g></svg>