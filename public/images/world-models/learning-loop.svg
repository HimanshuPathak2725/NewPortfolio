<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="learning-loop-title learning-loop-desc" data-world-svg="learning-loop">
<title id="learning-loop-title">From observation to action</title><desc id="learning-loop-desc">Five stages: observe the environment, encode a state, predict a future, score the future, and act in the real environment.</desc>
<style>
.wm-bg{fill:var(--paper,#fef9ed)} .wm-panel{fill:var(--surface,#f3efe4);stroke:var(--rule,#c49a6c);stroke-width:1.5}
.wm-ink{fill:var(--ink,#262723)} .wm-muted{fill:var(--muted,#6a6864)} .wm-green{stroke:var(--link,#476e49);fill:none;stroke-width:3}
.wm-blue{stroke:var(--brand,#5b6c8b);fill:none;stroke-width:3} .wm-orange{stroke:var(--warm,#946655);fill:none;stroke-width:3}
.wm-stage.is-current .wm-panel{stroke:var(--link,#476e49);stroke-width:3}
text{font-family:Georgia,serif;font-size:18px} .wm-label{font-size:21px} .wm-small{font-size:16px}
</style><rect class="wm-bg" width="720" height="440" rx="3"/><defs><marker id="wm-loop-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#946655"/></marker></defs><g id="wm-loop-node-0" class="wm-stage is-current"><rect class="wm-panel" x="20" y="60" width="195" height="118" rx="6"/><text class="wm-label wm-ink" x="36" y="94">Observe</text><text class="wm-small wm-muted" x="36" y="126">What can I see?</text><text class="wm-small wm-muted" x="36" y="154">camera, sensors, history</text></g><g id="wm-loop-node-1" class="wm-stage"><rect class="wm-panel" x="262" y="60" width="195" height="118" rx="6"/><text class="wm-label wm-ink" x="278" y="94">Encode</text><text class="wm-small wm-muted" x="278" y="126">Keep useful information</text><text class="wm-small wm-muted" x="278" y="154">observation → state</text></g><g id="wm-loop-node-2" class="wm-stage"><rect class="wm-panel" x="504" y="60" width="195" height="118" rx="6"/><text class="wm-label wm-ink" x="520" y="94">Predict</text><text class="wm-small wm-muted" x="520" y="126">What if I act?</text><text class="wm-small wm-muted" x="520" y="154">state + action → future</text></g><g id="wm-loop-node-3" class="wm-stage"><rect class="wm-panel" x="504" y="248" width="195" height="118" rx="6"/><text class="wm-label wm-ink" x="520" y="282">Score</text><text class="wm-small wm-muted" x="520" y="314">Which future helps?</text><text class="wm-small wm-muted" x="520" y="342">reward + future value</text></g><g id="wm-loop-node-4" class="wm-stage"><rect class="wm-panel" x="20" y="248" width="195" height="118" rx="6"/><text class="wm-label wm-ink" x="36" y="282">Act &amp; check</text><text class="wm-small wm-muted" x="36" y="314">Take a real action</text><text class="wm-small wm-muted" x="36" y="342">compare with reality</text></g><path d="M219 119H253" fill="none" stroke="#946655" stroke-width="2" marker-end="url(#wm-loop-arrow)"/><path d="M461 119H495" fill="none" stroke="#946655" stroke-width="2" marker-end="url(#wm-loop-arrow)"/><path d="M602 187V236" fill="none" stroke="#946655" stroke-width="2" marker-end="url(#wm-loop-arrow)"/><path d="M494 307H228" fill="none" stroke="#946655" stroke-width="2" marker-end="url(#wm-loop-arrow)"/><path d="M117 238V190" fill="none" stroke="#946655" stroke-width="2" marker-end="url(#wm-loop-arrow)"/><text class="wm-muted" x="260" y="284">Imagination stays inside</text><text class="wm-muted" x="260" y="311">the learned model.</text><text class="wm-muted" x="24" y="408">Prediction supports a decision. Real feedback checks the prediction.</text></svg>