.wm-blue{stroke:var(--brand,#5b6c8b);fill:none;stroke-width:3} .wm-orange{stroke:var(--warm,#946655);fill:none;stroke-width:3}
.wm-stage.is-current .wm-panel{stroke:var(--link,#476e49);stroke-width:3}
text{font-family:Georgia,serif;font-size:18px} .wm-label{font-size:21px} .wm-small{font-size:16px}
