<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 414" role="img" aria-labelledby="imagined-routes-title imagined-routes-desc" data-world-svg="imagined-routes">
<title id="imagined-routes-title">Comparing imagined routes</title><desc id="imagined-routes-desc">A six by four toy grid. The agent starts at the lower left. The goal at the upper right rewards ten. An orange hazard on the bottom row penalizes eight. The dashed green route avoids the hazard.</desc>
