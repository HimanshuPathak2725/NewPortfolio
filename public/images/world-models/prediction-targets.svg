<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="prediction-targets-title prediction-targets-desc" data-world-svg="prediction-targets">
<title id="prediction-targets-title">Pixels and representations</title><desc id="prediction-targets-desc">Two schematic pipelines. Pixel prediction maps a visual context through a video predictor to future frames. Representation prediction maps context features through a latent predictor to future features.</desc>
<style>
.wm-bg{fill:var(--paper,#fef9ed)} .wm-panel{fill:var(--surface,#f3efe4);stroke:var(--rule,#c49a6c);stroke-width:1.5}
.wm-ink{fill:var(--ink,#262723)} .wm-muted{fill:var(--muted,#6a6864)} .wm-green{stroke:var(--link,#476e49);fill:none;stroke-width:3}
.wm-blue{stroke:var(--brand,#5b6c8b);fill:none;stroke-width:3} .wm-orange{stroke:var(--warm,#946655);fill:none;stroke-width:3}
.wm-stage.is-current .wm-panel{stroke:var(--link,#476e49);stroke-width:3}
text{font-family:Georgia,serif;font-size:18px} .wm-label{font-size:21px} .wm-small{font-size:16px}
</style><rect class="wm-bg" width="720" height="420" rx="3"/><text class="wm-label wm-ink" x="26" y="38">Two useful prediction targets</text><rect class="wm-panel" x="24" y="66" width="672" height="144" rx="6"/><text class="wm-label wm-ink" x="44" y="98">Pixel prediction</text><text class="wm-small wm-muted" x="44" y="125">Draw what the future might look like.</text><rect class="wm-panel" x="24" y="246" width="672" height="144" rx="6"/><text class="wm-label wm-ink" x="44" y="278">Representation prediction</text><text class="wm-small wm-muted" x="44" y="305">Predict features useful for a downstream task.</text><rect x="48" y="143" width="116" height="48" rx="3" fill="#c49a6c" opacity="0.3"/><circle cx="96" cy="164" r="14" fill="#5b6c8b"/><path d="M96 178V186" stroke="#5b6c8b" stroke-width="3"/><text class="wm-ink" x="190" y="175">→</text><rect x="236" y="143" width="144" height="48" rx="3" fill="#527c55" opacity="0.2"/><text class="wm-small wm-ink" x="250" y="171">video predictor</text><text class="wm-ink" x="405" y="175">→</text><rect x="448" y="143" width="204" height="48" rx="3" fill="#c49a6c" opacity="0.3"/><circle cx="541" cy="165" r="14" fill="#5b6c8b"/><path d="M541 179V186" stroke="#5b6c8b" stroke-width="3"/><text class="wm-small wm-ink" x="48" y="351">context features</text><text class="wm-ink" x="190" y="351">→</text><rect x="236" y="323" width="144" height="48" rx="3" fill="#527c55" opacity="0.2"/><text class="wm-small wm-ink" x="250" y="351">latent predictor</text><text class="wm-ink" x="405" y="351">→</text><text class="wm-small wm-ink" x="448" y="351">future features</text></svg>