<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="rssm-architecture-v2-title rssm-architecture-v2-desc"><title id="rssm-architecture-v2-title">Predictive and observation-conditioned paths in an RSSM</title><desc id="rssm-architecture-v2-desc">Deterministic memory supports a predictive prior over latent state. An observed image also informs a posterior. During imagination the system uses the predictive path without new observations.</desc><text x="40" y="42" font-size="22" fill="#263b43" text-anchor="start" font-family="Georgia,serif">A recurrent state-space model: the two information paths</text><rect x="40" y="80" width="180" height="72" rx="4" fill="#547a94" fill-opacity=".07" stroke="#547a94" stroke-opacity=".5"/><text x="54" y="107" font-size="18" fill="#263b43" text-anchor="start" font-family="Georgia,serif">Memory hₜ</text><text x="54" y="132" font-size="14" fill="#547a94" text-anchor="start" font-family="Georgia,serif">past latent + past action</text><rect x="295" y="80" width="210" height="72" rx="4" fill="#547a94" fill-opacity=".07" stroke="#547a94" stroke-opacity=".5"/><text x="309" y="107" font-size="18" fill="#263b43" text-anchor="start" font-family="Georgia,serif">Predictive prior</text><text x="309" y="132" font-size="14" fill="#547a94" text-anchor="start" font-family="Georgia,serif">p(zₜ | hₜ)</text><rect x="585" y="80" width="270" height="72" rx="4" fill="#547a94" fill-opacity=".07" stroke="#547a94" stroke-opacity=".5"/><text x="599" y="107" font-size="18" fill="#263b43" text-anchor="start" font-family="Georgia,serif">Imagined latent</text><text x="599" y="132" font-size="14" fill="#547a94" text-anchor="start" font-family="Georgia,serif">sample zₜ without new pixels</text><rect x="40" y="250" width="180" height="72" rx="4" fill="#b2754e" fill-opacity=".07" stroke="#b2754e" stroke-opacity=".5"/><text x="54" y="277" font-size="18" fill="#263b43" text-anchor="start" font-family="Georgia,serif">Observation oₜ</text><text x="54" y="302" font-size="14" fill="#b2754e" text-anchor="start" font-family="Georgia,serif">new sensory evidence</text><rect x="295" y="250" width="210" height="72" rx="4" fill="#3b796b" fill-opacity=".07" stroke="#3b796b" stroke-opacity=".5"/><text x="309" y="277" font-size="18" fill="#263b43" text-anchor="start" font-family="Georgia,serif">Posterior correction</text><text x="309" y="302" font-size="14" fill="#3b796b" text-anchor="start" font-family="Georgia,serif">q(zₜ | hₜ, oₜ)</text><rect x="585" y="250" width="270" height="72" rx="4" fill="#3b796b" fill-opacity=".07" stroke="#3b796b" stroke-opacity=".5"/><text x="599" y="277" font-size="18" fill="#263b43" text-anchor="start" font-family="Georgia,serif">Model state (hₜ, zₜ)</text><text x="599" y="302" font-size="14" fill="#3b796b" text-anchor="start" font-family="Georgia,serif">reward · continue · decode</text><path d="M220 116H285" stroke="#74817b" stroke-width="2" stroke-dasharray="5 4" fill="none"/><path d="M505 116H575" stroke="#74817b" stroke-width="2" stroke-dasharray="5 4" fill="none"/><path d="M220 286H285" stroke="#74817b" stroke-width="2" stroke-dasharray="5 4" fill="none"/><path d="M505 286H575" stroke="#74817b" stroke-width="2" stroke-dasharray="5 4" fill="none"/><path d="M130 152V240" stroke="#74817b" stroke-width="2" stroke-dasharray="5 4" fill="none"/><path d="M400 152V240" stroke="#74817b" stroke-width="2" stroke-dasharray="5 4" fill="none"/><path d="M720 152V240" stroke="#74817b" stroke-width="2" stroke-dasharray="5 4" fill="none"/><text x="40" y="390" font-size="19" fill="#263b43" text-anchor="start" font-family="Georgia,serif">During imagination, no new observation is available to correct the prior.</text><text x="40" y="425" font-size="16" fill="#74817b" text-anchor="start" font-family="Georgia,serif">Schematic RSSM information flow. Parameterizations differ across papers.</text></svg>