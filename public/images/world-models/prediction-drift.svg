<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 432" role="img" aria-labelledby="prediction-drift-title prediction-drift-desc" data-world-svg="prediction-drift">
<title id="prediction-drift-title">Prediction error over a rollout</title><desc id="prediction-drift-desc">A toy chart compares the true dynamics x next equals x plus one with a model that multiplies its current position by 1.03 before adding one. Both start at zero. Predicted position increasingly exceeds the true position over twenty steps.</desc>
