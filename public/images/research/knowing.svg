<svg class="research-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" role="img" aria-labelledby="knowing-title knowing-desc"><title id="knowing-title">What counts as knowing?</title><desc id="knowing-desc">An open research notebook presents the conjecture that every odd number is prime. The counterexample 9 equals 3 times 3 disproves it. A revised statement notes that every prime greater than 2 is odd. This is an illustrative reasoning example, not a claim about the dataset contents.</desc><style>.research-art{--ri-ink:#454354;--ri-blue:#5268ac;--ri-green:#368778;--ri-red:#bf675b;--ri-gold:#c89636;--ri-purple:#9672aa;--ri-page:#faf2df;color:#454354}.research-art .ink{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.research-art .fine{stroke-width:.8}.research-art .soft{opacity:.28}.research-art .blue{color:#5268ac}.research-art .green{color:#368778}.research-art .red{color:#bf675b}.research-art .gold{color:#c89636}.research-art .purple{color:#9672aa}.research-art text{fill:currentColor;font-family:Georgia,serif;font-size:15px}.research-art .hand{font-style:italic}.research-art .small{font-size:12px;letter-spacing:.6px}.research-art .code{font-family:monospace;font-size:14px}.research-art .wash{stroke:none;opacity:.18}.research-art .paper{fill:#faf2df;stroke:currentColor;stroke-width:1.2}.research-art .dot{fill:currentColor;stroke:none}
