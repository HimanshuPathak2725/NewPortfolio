<svg class="research-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" role="img" aria-labelledby="symbols-title symbols-desc"><title id="symbols-title">The rules beneath the symbols</title><desc id="symbols-desc">A fictional North American telephone number, +1 (202) 555-0147, becomes 2025550147 after removing permitted formatting and the leading country code. Letters must be rejected; area and exchange prefixes must begin from 2 through 9.</desc><style>.research-art{--ri-ink:#454354;--ri-blue:#5268ac;--ri-green:#368778;--ri-red:#bf675b;--ri-gold:#c89636;--ri-purple:#9672aa;--ri-page:#faf2df;color:#454354}.research-art .ink{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.research-art .fine{stroke-width:.8}.research-art .soft{opacity:.28}.research-art .blue{color:#5268ac}.research-art .green{color:#368778}.research-art .red{color:#bf675b}.research-art .gold{color:#c89636}.research-art .purple{color:#9672aa}.research-art text{fill:currentColor;font-family:Georgia,serif;font-size:15px}.research-art .hand{font-style:italic}.research-art .small{font-size:12px;letter-spacing:.6px}.research-art .code{font-family:monospace;font-size:14px}.research-art .wash{stroke:none;opacity:.18}.research-art .paper{fill:#faf2df;stroke:currentColor;stroke-width:1.2}.research-art .dot{fill:currentColor;stroke:none}
</style><defs><marker id="symbols-red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path class="ink red" d="M2 1L9 5L2 9"/></marker><marker id="symbols-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path class="ink blue" d="M2 1L9 5L2 9"/></marker><marker id="symbols-purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path class="ink purple" d="M2 1L9 5L2 9"/></marker><marker id="symbols-green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path class="ink green" d="M2 1L9 5L2 9"/></marker></defs>
